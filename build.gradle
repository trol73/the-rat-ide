plugins {
    id 'java'
    id 'application'
}

group = 'ru.trolsoft'
version = '0.3'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'org.fife.rtext.Main'
}

repositories {
    mavenCentral()
}

// Collect all local jar dependencies from lib/
def localJars = fileTree('lib').include('*.jar')

dependencies {
    localJars.each { jar ->
        implementation files(jar)
    }
}

// Add resource directories
sourceSets.main.resources.srcDirs += ['src/main/dist', 'src/main/resources']

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    archiveBaseName = 'the-rat'
    archiveVersion = ''
    archiveClassifier = ''
    archiveFileName = 'the-rat.jar'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Main-Class': 'org.fife.rtext.Main',
            'Specification-Version': version
        )
    }

    // Extract all dependency JARs into this JAR (like IntelliJ artifact does with path-in-jar="/")
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    // Include native libraries from native/ directory (must be last to avoid being overwritten)
    from('native') {
        into 'native'
    }
}
