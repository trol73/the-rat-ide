name: Nightly Build

on:
  schedule:
    # Каждый день в 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Ручной запуск по желанию

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build with Gradle
        run: ./gradlew jar --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-rat-nightly-${{ github.run_number }}
          path: build/libs/the-rat.jar
          retention-days: 90

      - name: Delete old nightly releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release list \
            --limit 100 \
            --order desc \
            --json tagName \
            --jq 'map(select(.tagName | startswith("nightly-")))
                  | .[3:]
                  | .[].tagName' \
          | while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              echo "Deleting old nightly release: $tag"
              gh release delete "$tag" \
                --repo "${{ github.repository }}" \
                --yes --cleanup-tag || true
            done